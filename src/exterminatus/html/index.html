<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Command</title>
  <link rel="stylesheet" href="terminal.css">
</head>
<body class="mode-bar">
  <main class="terminal" aria-label="Command terminal" aria-busy="false">
    <div id="busy" role="progressbar" aria-label="Working"></div>

    <div id="log"
         role="log"
         aria-label="Command output"
         aria-live="polite"
         aria-relevant="additions text"
         tabindex="0"></div>

    <div class="command">
      <div id="prompt" class="is-hidden">
        <span class="prompt__text"></span>
        <span class="prompt__default"></span>
        <span class="prompt__options"></span>
      </div>

      <div class="entry">
        <input id="input"
               type="text"
               placeholder="Command"
               aria-label="Command"
               aria-describedby="prompt input-hint"
               role="combobox"
               aria-autocomplete="list"
               aria-controls="suggest"
               aria-expanded="false"
               autocomplete="off"
               autocapitalize="off"
               spellcheck="false">
        <span id="input-hint" class="input-hint is-hidden">
          Space — repeat last
        </span>
        <button id="pin" class="pin" type="button" aria-pressed="false"
                title="Keep the command line open" aria-label="Keep the command line open">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M10.5 1.5l4 4-1.5 1-1.2-.4-2.6 2.6.4 3.3-1.1 1.1-2.8-2.8L2 14l-.1-.1L5.6 10 2.8 7.2l1.1-1.1 3.3.4 2.6-2.6-.4-1.2z"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="suggest"
         class="is-hidden"
         role="listbox"
         aria-label="Command suggestions"></div>
  </main>

  <script src="terminal.js"></script>
</body>
</html>
